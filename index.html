<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoMaster Brasil</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #021B79, #0575E6, #00c6ff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .game {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      text-align: center;
      animation: aparecer 0.8s ease;
    }

    h1 {
      color: #0b3d91;
      margin-bottom: 10px;
    }

    .mapa {
      width: 120px;
      margin-bottom: 15px;
      border-radius: 15px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .categoria {
      color: #555;
      margin-bottom: 10px;
    }

    .pergunta {
      background: linear-gradient(to right, #d7f3ff, #e0f7fa);
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .opcao {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 15px;
      background: linear-gradient(to right, #1565c0, #00bcd4);
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .opcao:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .mensagem {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .inicio button,
    .fim button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      margin-top: 10px;
      cursor: pointer;
    }

    .entrar {
      background: #4caf50;
      color: white;
    }

    .sair {
      background: #f44336;
      color: white;
    }

    .reiniciar {
      background: #ffeb3b;
    }
  </style>
</head>
<body>

<div class="game" id="game">
  <div class="inicio" id="inicio">
    <img class="mapa" src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg">
    <h1>🌍 GeoMaster Brasil</h1>
    <p>Desafie seus conhecimentos em geografia com 60 perguntas únicas!</p>

    <br>

    <p>🌎 10 perguntas sobre Países</p>
    <p>🗺️ 10 perguntas sobre Mapas</p>
    <p>🌦️ 10 perguntas sobre Clima</p>
    <p>⛰️ 10 perguntas sobre Relevo</p>
    <p>🏛️ 10 perguntas sobre Capitais</p>
    <p>🌍 10 perguntas sobre Continentes</p>

    <button class="entrar" onclick="iniciarJogo()">▶ Entrar</button>
    <button class="sair" onclick="window.close()">✖ Sair</button>
  </div>

  <div id="quiz" style="display:none;">
    <div class="info">
      <span id="pontos">🌟 0</span>
      <span id="vidas">❤️ 10</span>
    </div>

    <img class="mapa" src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg">

    <div class="categoria" id="categoria"></div>
    <div class="pergunta" id="pergunta"></div>
    <div style="margin-bottom:15px;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/World_map_-_low_resolution.svg/800px-World_map_-_low_resolution.svg.png" style="width:100%; border-radius:20px; box-shadow:0 8px 20px rgba(0,0,0,0.3);">
    </div>

    <div id="opcoes"></div>

    <div class="mensagem" id="mensagem"></div>
  </div>

  <div class="fim" id="fim" style="display:none;">
    <h1>🏆 Fim de Jogo</h1>
    <p id="resultado"></p>
    <button class="reiniciar" onclick="reiniciarJogo()">🔄 Jogar Novamente</button>
  </div>
</div>

let indice = 0;
let pontos = 0;
let vidas = 10;

function iniciarJogo() {
  document.getElementById('inicio').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  mostrarPergunta();
}

function mostrarPergunta() {
  if(indice >= perguntas.length || vidas <= 0) {
    finalizarJogo();
    return;
  }

  const atual = perguntas[indice];

  document.getElementById('categoria').innerText = atual.categoria;
  document.getElementById('pergunta').innerText = atual.pergunta;

  const opcoes = document.getElementById('opcoes');
  opcoes.innerHTML = '';

  atual.opcoes.forEach(opcao => {
    const botao = document.createElement('button');
    botao.className = 'opcao';
    botao.innerText = opcao;

    botao.onclick = () => responder(opcao);

    opcoes.appendChild(botao);
  });
}

function responder(opcao) {
  const atual = perguntas[indice];

  if(opcao === atual.resposta) {
    pontos += 10;
    document.getElementById('mensagem').innerText = '✅ Você acertou!';
  } else {
    vidas--;
    document.getElementById('mensagem').innerText = '❌ Você errou!';
  }

  document.getElementById('pontos').innerText = '🌟 ' + pontos;
  document.getElementById('vidas').innerText = '❤️ ' + vidas;

  indice++;

  setTimeout(() => {
    document.getElementById('mensagem').innerText = '';
    mostrarPergunta();
  }, 1000);
}

function finalizarJogo() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('fim').style.display = 'block';

  document.getElementById('resultado').innerText =
    'Pontuação final: ' + pontos;
}

function reiniciarJogo() {
  indice = 0;
  pontos = 0;
  vidas = 10;

  document.getElementById('fim').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';

  document.getElementById('pontos').innerText = '🌟 0';
  document.getElementById('vidas').innerText = '❤️ 10';

  mostrarPergunta();
}
